<h1>MIHM Inbox</h1>
<p>MIHM Inbox is a private, single-user tool. It runs on its owner's own computer and reads documents from the owner's own Google Drive inbox folder so they can be filed into a personal notebook.</p>
<p>It is not offered to anyone else, and there is nothing to sign up for.</p>
